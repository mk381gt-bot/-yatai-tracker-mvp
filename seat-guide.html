<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d91">
  <title>席案内トランスレーター</title>
  <link rel="manifest" href="seat-guide.webmanifest">
  <style>
    :root {
      --bg: #f4f6fa;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #5b6474;
      --line: #d7dce5;
      --accent: #0b3d91;
      --accent-ink: #ffffff;
      --warn: #b42318;
      --ok: #067647;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      background: var(--accent); color: var(--accent-ink);
    }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    .lang-btn {
      border: 2px solid rgba(255,255,255,.6); background: rgba(255,255,255,.12);
      border-radius: 999px; padding: 6px 14px; font-weight: 700; color: #fff;
    }

    nav.tabs {
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: var(--panel); border-bottom: 1px solid var(--line);
      position: sticky; top: 52px; z-index: 4;
    }
    nav.tabs button {
      border: 0; background: none; padding: 14px 4px; font-weight: 700; color: var(--muted);
      border-bottom: 3px solid transparent;
    }
    nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

    main { padding: 12px 12px 40px; max-width: 720px; margin: 0 auto; }
    section[hidden] { display: none; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .card h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); }

    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    label.field input, label.field select {
      font-size: 20px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
    }
    .arrows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .arrows button {
      font-size: 28px; padding: 10px 0; border: 1px solid var(--line); border-radius: 10px; background: #fff;
    }
    .arrows button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    .arrows button small { display: block; font-size: 11px; }

    .primary {
      width: 100%; border: 0; border-radius: 12px; padding: 16px; font-size: 18px; font-weight: 800;
      background: var(--accent); color: var(--accent-ink);
    }

    .search { width: 100%; font-size: 17px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
    .cat-title { font-size: 13px; font-weight: 800; color: var(--muted); margin: 18px 4px 8px; }
    .phrase {
      display: block; width: 100%; text-align: left; margin-bottom: 8px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
      font-size: 17px; line-height: 1.4;
    }
    .phrase.emergency { border-color: #f4b4ae; background: #fff5f4; }
    .phrase .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }

    .reply-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .reply {
      border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 22px 8px;
      font-size: 24px; font-weight: 800; text-align: center;
    }
    .reply .sub { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-top: 6px; }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* 全画面表示（お客様に見せる画面） */
    .overlay {
      position: fixed; inset: 0; z-index: 20; background: #fff;
      display: flex; flex-direction: column;
    }
    .overlay[hidden] { display: none; }
    .overlay .show {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; text-align: center; overflow: auto; transition: transform .25s;
    }
    .overlay.flipped .show { transform: rotate(180deg); }
    .show .big { font-size: clamp(30px, 8vw, 56px); font-weight: 800; line-height: 1.35; word-break: break-word; }
    .show .ja { margin-top: 18px; font-size: 16px; color: var(--muted); }
    .show .arrow-big { font-size: clamp(90px, 30vw, 180px); line-height: 1; margin: 8px 0; color: var(--accent); }
    .seat-table { margin-top: 12px; border-collapse: collapse; font-size: clamp(22px, 6vw, 40px); }
    .seat-table th { text-align: right; padding: 6px 14px; color: var(--muted); font-weight: 600; font-size: .6em; }
    .seat-table td { text-align: left; padding: 6px 14px; font-weight: 800; }
    [dir="rtl"] .seat-table th { text-align: left; }
    [dir="rtl"] .seat-table td { text-align: right; }
    .overlay .controls {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--line);
    }
    .overlay .controls button { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 14px 4px; font-weight: 700; }

    /* 言語選択 */
    .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; overflow: auto; }
    .lang-grid button {
      border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 18px 8px; font-size: 22px; font-weight: 800;
    }
    .lang-grid button[aria-pressed="true"] { border-color: var(--accent); background: #eef3ff; }
    .lang-grid button small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 4px; }
    .lang-head { padding: 20px 16px 0; text-align: center; font-size: 17px; line-height: 1.6; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>席案内トランスレーター</h1>
    <button class="lang-btn" id="langBtn" type="button">🌐 English</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="seat" aria-selected="true">座席</button>
    <button role="tab" data-tab="phrases" aria-selected="false">フレーズ</button>
    <button role="tab" data-tab="reply" aria-selected="false">お客様の返事</button>
  </nav>

  <main>
    <!-- 座席 -->
    <section id="tab-seat">
      <div class="card">
        <h2>チケットの座席情報</h2>
        <div class="field-grid">
          <label class="field">ゲート
            <input id="fGate" inputmode="text" autocomplete="off" placeholder="例: 3">
          </label>
          <label class="field">スタンド
            <select id="fStand">
              <option value="">（なし）</option>
              <option value="main">メイン</option>
              <option value="back">バック</option>
              <option value="north">北側</option>
              <option value="south">南側</option>
            </select>
          </label>
          <label class="field">ブロック
            <input id="fBlock" inputmode="text" autocomplete="off" placeholder="例: S12">
          </label>
          <label class="field">列
            <input id="fRow" inputmode="text" autocomplete="off" placeholder="例: 15">
          </label>
          <label class="field">番号
            <input id="fSeat" inputmode="numeric" autocomplete="off" placeholder="例: 23">
          </label>
        </div>
      </div>
      <div class="card">
        <h2>進む方向（任意）</h2>
        <div class="arrows" id="arrows">
          <button type="button" data-arrow="⬆">⬆<small>まっすぐ</small></button>
          <button type="button" data-arrow="⬅">⬅<small>左</small></button>
          <button type="button" data-arrow="➡">➡<small>右</small></button>
          <button type="button" data-arrow="⬇">⬇<small>戻る</small></button>
          <button type="button" data-arrow="↖">↖<small>左上</small></button>
          <button type="button" data-arrow="↗">↗<small>右上</small></button>
          <button type="button" data-arrow="↙">↙<small>左下</small></button>
          <button type="button" data-arrow="↘">↘<small>右下</small></button>
        </div>
      </div>
      <button class="primary" id="showSeat" type="button">お客様に見せる</button>
      <div class="card" style="margin-top:12px">
        <h2>キックオフ時刻を見せる</h2>
        <div class="arrows" id="kickoffs" style="grid-template-columns: repeat(2, 1fr);"></div>
      </div>
      <p class="hint">入力内容はこの端末の中だけで使います（送信しません）。</p>
    </section>

    <!-- フレーズ -->
    <section id="tab-phrases" hidden>
      <input class="search" id="search" type="search" placeholder="🔍 フレーズを検索（例: トイレ）">
      <div id="phraseList"></div>
    </section>

    <!-- 返事 -->
    <section id="tab-reply" hidden>
      <p class="hint">端末をお客様に渡して、当てはまるものを押してもらいます。押された返事は日本語で大きく表示されます。</p>
      <div class="reply-grid" id="replyGrid"></div>
    </section>
  </main>

  <!-- お客様に見せる全画面 -->
  <div class="overlay" id="showOverlay" hidden>
    <div class="show" id="showBody"></div>
    <div class="controls">
      <button type="button" id="flipBtn">↻ 上下反転</button>
      <button type="button" id="speakBtn">🔊 読み上げ</button>
      <button type="button" id="closeBtn">✕ 閉じる</button>
    </div>
  </div>

  <!-- 言語選択 -->
  <div class="overlay" id="langOverlay" hidden>
    <div class="lang-head" id="langHead"></div>
    <div class="lang-grid" id="langGrid"></div>
    <div class="controls" style="grid-template-columns: 1fr;">
      <button type="button" id="langClose">✕ 閉じる</button>
    </div>
  </div>

    ];

    // ---- お客様の返事 ----
    const REPLIES = [

      { ja: "連れとはぐれた", en: "I lost my companion", zh: "我和同伴走散了", tw: "我和同伴走散了", ko: "일행을 잃어버렸어요", th: "หลงกับเพื่อนที่มาด้วย", vi: "Tôi bị lạc người đi cùng", id: "Saya terpisah dari teman saya", ar: "فقدت مرافقي" },
      { ja: "落とし物をした", en: "I lost something", zh: "我丢了东西", tw: "我掉了東西", ko: "물건을 잃어버렸어요", th: "ทำของหาย", vi: "Tôi bị mất đồ", id: "Saya kehilangan barang", ar: "فقدت شيئًا" },
    ];

    // ---- 状態 ----
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動かす */ } },
    };
    let lang = LANGS.find(l => l.code === store.get("seatGuide.lang")) || LANGS[0];
    let arrow = "";
    let speakText = "";

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // ---- タブ ----
    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
        ["seat", "phrases", "reply"].forEach(t => { $("tab-" + t).hidden = t !== btn.dataset.tab; });
      });
    });

    // ---- 言語選択 ----
    function renderLangButton() {
      $("langBtn").textContent = "🌐 " + lang.name;
    }
    function openLangPicker() {
      $("langHead").innerHTML = LANGS.map(l => `<div dir="${l.rtl ? "rtl" : "ltr"}">${esc(LABELS.pick[l.code])}</div>`).join("");
      $("langGrid").innerHTML = LANGS.map(l =>
        `<button type="button" data-code="${l.code}" aria-pressed="${l.code === lang.code}">${esc(l.name)}<small>${esc(l.ja)}</small></button>`
      ).join("");
      $("langOverlay").hidden = false;
    }
    $("langBtn").addEventListener("click", openLangPicker);
    $("langClose").addEventListener("click", () => { $("langOverlay").hidden = true; });
    $("langGrid").addEventListener("click", e => {
      const btn = e.target.closest("button[data-code]");
      if (!btn) return;
      lang = LANGS.find(l => l.code === btn.dataset.code);
      store.set("seatGuide.lang", lang.code);
      renderLangButton();
      renderPhrases();
      renderReplies();
      $("langOverlay").hidden = true;
    });

    // ---- 全画面表示 ----
    function openShow(html, textForSpeech, dirRtl) {
      const body = $("showBody");
      body.innerHTML = html;
      body.setAttribute("dir", dirRtl ? "rtl" : "ltr");
      speakText = textForSpeech;
      $("speakBtn").disabled = !textForSpeech || !("speechSynthesis" in window);
      $("showOverlay").classList.remove("flipped");
      $("showOverlay").hidden = false;
    }
    $("flipBtn").addEventListener("click", () => $("showOverlay").classList.toggle("flipped"));
    $("closeBtn").addEventListener("click", () => {
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      $("showOverlay").hidden = true;
    });
    $("speakBtn").addEventListener("click", () => {
      if (!speakText || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(speakText);
      u.lang = lang.speech;
      speechSynthesis.speak(u);
    });

    // ---- 座席 ----
    $("arrows").addEventListener("click", e => {
      const btn = e.target.closest("button[data-arrow]");
      if (!btn) return;
      arrow = arrow === btn.dataset.arrow ? "" : btn.dataset.arrow;
      document.querySelectorAll("#arrows button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.arrow === arrow)));
    });

    $("showSeat").addEventListener("click", () => {
      const c = lang.code;
      const stand = $("fStand").value;
      const rows = [
        ["gate", $("fGate").value.trim()],
        ["stand", stand ? STANDS[stand][c] : ""],
        ["block", $("fBlock").value.trim()],
        ["row", $("fRow").value.trim()],
        ["seat", $("fSeat").value.trim()],
      ].filter(([, v]) => v);

      if (!rows.length && !arrow) {
        alert("座席情報か方向を入力してください。");
        return;
      }
      const table = rows.length
        ? `<table class="seat-table">${rows.map(([k, v]) => `<tr><th>${esc(LABELS[k][c])}</th><td>${esc(v)}</td></tr>`).join("")}</table>`
        : "";
      const jaLine = rows.map(([k, v]) => `${LABELS[k].ja} ${k === "stand" ? STANDS[stand].ja : v}`).join(" / ");
      const html =
        `<div class="big">${esc(LABELS.title[c])}</div>` +
        table +
        (arrow ? `<div class="arrow-big" dir="ltr">${arrow}</div><div class="big" style="font-size:clamp(22px,6vw,36px)">${esc(LABELS.way[c])}</div>` : "") +
        `<div class="ja" dir="ltr">${esc(jaLine || LABELS.way.ja)}</div>`;
      openShow(html, arrow ? LABELS.way[c] : LABELS.title[c], lang.rtl);
    });

    // ---- キックオフ時刻 ----
    $("kickoffs").innerHTML = KICKOFFS.map(t => `<button type="button" data-time="${t}">${t}</button>`).join("");
    $("kickoffs").addEventListener("click", e => {
      const btn = e.target.closest("button[data-time]");
      if (!btn) return;
      const c = lang.code;
      openShow(
        `<div class="big">${esc(LABELS.kickoff[c])}</div><div class="arrow-big" dir="ltr" style="font-size:clamp(64px,22vw,140px)">${btn.dataset.time}</div><div class="ja" dir="ltr">キックオフ ${btn.dataset.time}</div>`,
        `${LABELS.kickoff[c]} ${btn.dataset.time}`, lang.rtl);
    });

    // ---- フレーズ ----
    function renderPhrases() {
      const q = $("search").value.trim();
      const c = lang.code;
      $("phraseList").innerHTML = CATEGORIES.map(cat => {
        const items = PHRASES
          .map((p, i) => ({ p, i }))
          .filter(({ p }) => p.cat === cat.id && (!q || p.ja.includes(q) || p[c].toLowerCase().includes(q.toLowerCase())));
        if (!items.length) return "";
        return `<div class="cat-title">${esc(cat.name)}</div>` + items.map(({ p, i }) =>
          `<button type="button" class="phrase${cat.emergency ? " emergency" : ""}" data-i="${i}">${esc(p.ja)}<span class="sub" dir="${lang.rtl ? "rtl" : "ltr"}">${esc(p[c])}</span></button>`
        ).join("");
      }).join("") || `<p class="hint">見つかりませんでした。</p>`;
    }
    $("search").addEventListener("input", renderPhrases);
    $("phraseList").addEventListener("click", e => {
      const btn = e.target.closest("button[data-i]");
      if (!btn) return;
      const p = PHRASES[Number(btn.dataset.i)];
      openShow(`<div class="big">${esc(p[lang.code])}</div><div class="ja" dir="ltr">${esc(p.ja)}</div>`, p[lang.code], lang.rtl);
    });

    // ---- 返事 ----
    function renderReplies() {
      $("replyGrid").innerHTML = REPLIES.map((r, i) =>
        `<button type="button" class="reply" data-i="${i}"><span dir="${lang.rtl ? "rtl" : "ltr"}">${esc(r[lang.code])}</span><span class="sub">${esc(r.ja)}</span></button>`
      ).join("");
    }
    $("replyGrid").addEventListener("click", e => {
      const btn = e.target.closest("button[data-i]");
      if (!btn) return;
      const r = REPLIES[Number(btn.dataset.i)];
      // スタッフが読むので日本語を大きく
      openShow(`<div class="big">${esc(r.ja)}</div><div class="ja" dir="${lang.rtl ? "rtl" : "ltr"}">${esc(r[lang.code])}</div>`, "", false);
    });

    // ---- 起動 ----
    renderLangButton();
    renderPhrases();
    renderReplies();

    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("seat-guide-sw.js").catch(() => { /* オフライン非対応でも動かす */ });
    }
  </script>
</body>
</html>
