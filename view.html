<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>屋台トラッカー</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --card: #fffaf0;
      --ink: #1f2933;
      --muted: #5b6470;
      --line: #dacfb9;
      --accent: #b63224;
      --accent-dark: #872218;
      --warning-bg: #fff3cd;
      --warning-line: #d39e00;
      --error-bg: #fde8e8;
      --error-line: #c53030;
      --ok-bg: #e6f4ea;
      --ok-line: #2f855a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 18px 12px;
      background: #8f241b;
      color: #fffaf0;
      border-bottom: 4px solid #d7a83d;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      font-size: 15px;
      line-height: 1.5;
      opacity: 0.94;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-card,
    .notice,
    .message {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 1px 2px rgba(31, 41, 51, 0.08);
    }

    .info-card {
      padding: 16px;
    }

    .label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .dashi-name {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 800;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .info-item {
      padding: 12px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #eadfca;
    }

    .info-value {
      margin: 0;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
    }

    .map-wrap {
      display: block;
      flex: 0 0 auto;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #dfe7df;
    }

    #map {
      width: 100%;
      height: 520px;
      min-height: 400px;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
    }

    .notice,
    .message {
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.65;
    }

    .notice {
      background: #fffaf0;
    }

    .message {
      display: none;
      font-weight: 700;
    }

    .message.is-visible {
      display: block;
    }

    .message.warning {
      background: var(--warning-bg);
      border-color: var(--warning-line);
      color: #5f4300;
    }

    .message.error {
      background: var(--error-bg);
      border-color: var(--error-line);
      color: #7b1e1e;
    }

    .message.ok {
      background: var(--ok-bg);
      border-color: var(--ok-line);
      color: #1f5f3d;
    }

    .auto-update-panel {
      display: none;
      padding: 14px 16px;
      border: 1px solid var(--warning-line);
      border-radius: 8px;
      background: var(--warning-bg);
      color: #5f4300;
      font-size: 16px;
      line-height: 1.65;
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(31, 41, 51, 0.08);
    }

    .auto-update-panel.is-visible {
      display: block;
    }

    .update-button {
      width: 100%;
      min-height: 52px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fffaf0;
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .update-button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .marker-pin {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 3px solid #fffaf0;
      border-radius: 50% 50% 50% 0;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      transform: rotate(-45deg);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .marker-pin span {
      transform: rotate(45deg);
      font-size: 17px;
    }

    .leaflet-popup-content {
      font-size: 16px;
      line-height: 1.5;
    }

    .weather-card {
      display: none;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 1px 2px rgba(31, 41, 51, 0.08);
    }

    .weather-card.is-visible {
      display: block;
    }

    .weather-summary {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.5;
    }

    .weather-summary.is-rainy {
      color: #2b4c8c;
    }

    .weather-hours {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
    }

    .weather-hours li {
      padding: 6px 2px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #eadfca;
    }

    .weather-hours strong {
      display: block;
      font-size: 15px;
    }

    .weather-source {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .map-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .poi-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 4px 12px 4px 6px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .poi-chip[aria-pressed="false"] {
      opacity: 0.55;
      border-style: dashed;
    }

    .poi-chip[aria-pressed="false"] .poi-dot {
      filter: grayscale(1);
    }

    .poi-dot,
    .poi-icon {
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-weight: 900;
    }

    .poi-dot {
      width: 26px;
      height: 26px;
      font-size: 11px;
    }

    .poi-icon {
      width: 28px;
      height: 28px;
      border: 2px solid #fff;
      font-size: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .follow-button {
      display: none;
      margin-left: auto;
      min-height: 40px;
      padding: 4px 14px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fffaf0;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .follow-button.is-visible {
      display: inline-block;
    }

    .poi-note {
      color: var(--muted);
      font-size: 14px;
    }

    .attribution {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (min-width: 720px) {
      header {
        padding-left: 24px;
        padding-right: 24px;
      }

      h1 {
        font-size: 30px;
      }

      main {
        padding: 18px;
      }

      .info-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #map {
        height: 600px;
      }
    }

    @media (max-width: 480px) {
      #map {
        height: 430px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>屋台トラッカー</h1>
      <p class="subtitle">現在地の目安を地図で確認できます</p>
    </header>

    <main>
      <section class="info-card" aria-label="山車情報">
        <p class="label">表示中の山車</p>
        <p class="dashi-name" id="dashiName">読み込み中</p>

        <div class="info-grid">
          <div class="info-item">
            <p class="label">状況</p>
            <p class="info-value" id="dashiStatus">確認中</p>
          </div>
          <div class="info-item">
            <p class="label">最終更新</p>
            <p class="info-value" id="updatedAt">確認中</p>
          </div>
        </div>
      </section>

      <section id="weatherCard" class="weather-card" aria-label="天気" aria-live="polite">
        <p class="label">山車付近の天気（今後6時間）</p>
        <p id="weatherSummary" class="weather-summary"></p>
        <ul id="weatherHours" class="weather-hours"></ul>
        <p class="weather-source">予報: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（CC BY 4.0）</p>
      </section>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <div id="autoUpdatePanel" class="auto-update-panel" aria-live="polite">
        <div id="autoUpdateMessage">
          現在地の自動更新を一時停止しました。<br>
          最新の位置を見るには更新ボタンを押してください。
        </div>
        <button id="manualUpdateButton" class="update-button" type="button">山車の位置を更新する</button>
      </div>

      <div class="map-tools">
        <div id="poiChips" class="map-tools" aria-label="地図に表示する情報"></div>
        <button id="followButton" class="follow-button" type="button">山車の位置に戻る</button>
      </div>

      <section class="map-wrap" aria-label="山車の現在地">
        <div id="map"></div>
      </section>

      <section class="notice" aria-label="注意書き">
        位置情報は目安です。<br>
        電波状況やGPS精度により、実際の山車位置とずれる場合があります。
        <div id="poiAttribution" class="attribution"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /*
      Firebase設定をここに貼り付けてください。

      1. Firebaseコンソールで対象プロジェクトを開く
      2. Webアプリの設定から firebaseConfig をコピーする
      3. 下の値を本物の設定値に置き換える

      注意:
      - databaseURL は Realtime Database のURLです。
      - このStep 1では読み取り確認だけを目的にしています。
      - 本物のFirebase設定値は、このひな形には入れていません。
    */
      const firebaseConfig = {
          apiKey: "AIzaSyAyjY-UCisOurFJnLD4FD2cvYgX251SVeU",
          authDomain: "yatai-tracker-mvp.firebaseapp.com",
          databaseURL: "https://yatai-tracker-mvp-default-rtdb.firebaseio.com",
          projectId: "yatai-tracker-mvp",
          storageBucket: "yatai-tracker-mvp.firebasestorage.app",
          messagingSenderId: "285283040023",
          appId: "1:285283040023:web:af6de79936a5d0db321552"
      };
    const DEFAULT_DASHI_ID = "dashi01";
    const STALE_LIMIT_MS = 3 * 60 * 1000;
    const AUTO_UPDATE_LIMIT_MS = 5 * 60 * 1000;
    // テスト時は 10 * 1000 にすると10秒で確認しやすいです。最終値は5分です。
    const DEFAULT_CENTER = [34.768, 137.998];
    const POI_FILE = "pois.json";
    const WEATHER_REFRESH_MS = 30 * 60 * 1000;
    // poi-builder.html と同じ定義にしてください。
    const CATEGORIES = {
      toilet:   { label: "トイレ",     short: "WC", color: "#2b6cb0", visible: true },
      tmptoilet:{ label: "臨時トイレ", short: "WC", color: "#3182ce", visible: true },
      hq:       { label: "本部",       short: "本", color: "#b7791f", visible: true },
      firstaid: { label: "救護所",     short: "救", color: "#d53f8c", visible: true },
      aed:      { label: "AED",        short: "AED", color: "#c53030", visible: true },
      shelter:  { label: "避難場所",   short: "避", color: "#2f855a", visible: false },
      parking:  { label: "駐車場",     short: "P",  color: "#4a5568", visible: false },
      other:    { label: "その他",     short: "他", color: "#6b46c1", visible: true }
    };
    const params = new URLSearchParams(window.location.search);
    const dashiId = params.get("id") || DEFAULT_DASHI_ID;

    const elements = {
      dashiName: document.getElementById("dashiName"),
      dashiStatus: document.getElementById("dashiStatus"),
      updatedAt: document.getElementById("updatedAt"),
      message: document.getElementById("message"),
      autoUpdatePanel: document.getElementById("autoUpdatePanel"),
      autoUpdateMessage: document.getElementById("autoUpdateMessage"),
      manualUpdateButton: document.getElementById("manualUpdateButton"),
      weatherCard: document.getElementById("weatherCard"),
      weatherSummary: document.getElementById("weatherSummary"),
      weatherHours: document.getElementById("weatherHours"),
      poiChips: document.getElementById("poiChips"),
      poiAttribution: document.getElementById("poiAttribution"),
      followButton: document.getElementById("followButton")
    };

    let latestData = null;
    let marker = null;
    let firebaseModules = null;
    let database = null;
    let locationRef = null;
    let unsubscribeLocation = null;
    let autoUpdateTimer = null;
    let followDashi = true;
    let poiCenter = null;
    let lastWeatherFetch = 0;

    const map = L.map("map", {
      zoomControl: true
    }).setView(DEFAULT_CENTER, 16);

    L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>',
      maxZoom: 18
    }).addTo(map);

    map.invalidateSize();
    setTimeout(() => map.invalidateSize(), 100);

    const dashiIcon = L.divIcon({
      className: "",
      html: '<div class="marker-pin"><span>祭</span></div>',
      iconSize: [42, 42],
      iconAnchor: [21, 42],
      popupAnchor: [0, -42]
    });

    function refreshMapSize() {
      requestAnimationFrame(() => {
        map.invalidateSize();
      });

      setTimeout(() => {
        map.invalidateSize();
      }, 100);

      setTimeout(() => {
        map.invalidateSize();
      }, 250);
    }

    function showMessage(type, text) {
      elements.message.className = `message ${type} is-visible`;
      elements.message.innerHTML = text;
      refreshMapSize();
    }

    function hideMessage() {
      elements.message.className = "message";
      elements.message.textContent = "";
      refreshMapSize();
    }

    function showAutoUpdateStopped() {
      elements.autoUpdatePanel.classList.add("is-visible");
      elements.manualUpdateButton.disabled = false;
      elements.autoUpdateMessage.innerHTML = "現在地の自動更新を一時停止しました。<br>最新の位置を見るには更新ボタンを押してください。";
      refreshMapSize();
    }

    function hideAutoUpdateStopped() {
      elements.autoUpdatePanel.classList.remove("is-visible");
      elements.manualUpdateButton.disabled = false;
      refreshMapSize();
    }

    function isFirebaseConfigMissing(config) {
      return Object.values(config).some((value) => {
        return typeof value !== "string" || value.trim() === "" || value.includes("ここに");
      });
    }

    function formatUpdatedAt(timestamp) {
      const normalizedTimestamp = normalizeUpdatedAt(timestamp);

      if (!Number.isFinite(normalizedTimestamp)) {
        return "時刻不明";
      }

      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date(normalizedTimestamp));
    }

    function isValidLocation(data) {
      return (
        data &&
        Number.isFinite(Number(data.lat)) &&
        Number.isFinite(Number(data.lng))
      );
    }

    function normalizeUpdatedAt(value) {
      const timestamp = Number(value);

      if (!Number.isFinite(timestamp)) {
        return NaN;
      }

      return timestamp;
    }

    function updateStaleWarning(data) {
      const updatedAt = normalizeUpdatedAt(data && data.updatedAt);

      if (!Number.isFinite(updatedAt)) {
        return;
      }

      const elapsed = Date.now() - updatedAt;
      if (elapsed > STALE_LIMIT_MS) {
        showMessage(
          "warning",
          "位置情報の更新が3分以上止まっています。<br>山車側スマホの通信、電池、画面スリープなどの影響で停止している可能性があります。"
        );
        return;
      }

      if (elements.message.classList.contains("warning")) {
        hideMessage();
      }
    }

    function updateView(data) {
      latestData = data;

      const lat = Number(data.lat);
      const lng = Number(data.lng);
      const name = data.name || dashiId;
      const status = data.status || "状況不明";
      const updatedAt = normalizeUpdatedAt(data.updatedAt);
      const position = [lat, lng];

      elements.dashiName.textContent = name;
      elements.dashiStatus.textContent = status;
      elements.updatedAt.textContent = formatUpdatedAt(updatedAt);

      const popupHtml = `<strong>${escapeHtml(name)}</strong><br>${escapeHtml(status)}<br>${escapeHtml(formatUpdatedAt(updatedAt))}`;

      if (!marker) {
        marker = L.marker(position, { icon: dashiIcon, zIndexOffset: 1000 }).addTo(map);
        marker.bindPopup(popupHtml).openPopup();
      } else {
        marker.setLatLng(position);
        marker.setPopupContent(popupHtml);
      }

      refreshMapSize();
      if (followDashi) {
        map.setView(position, map.getZoom(), { animate: true });
      }
      maybeUpdateWeather();
      setTimeout(() => map.invalidateSize(), 100);
      refreshMapSize();
      updateStaleWarning(data);
    }

    function startAutoUpdateTimer() {
      clearTimeout(autoUpdateTimer);
      autoUpdateTimer = setTimeout(stopAutoUpdate, AUTO_UPDATE_LIMIT_MS);
    }

    function stopAutoUpdate() {
      clearTimeout(autoUpdateTimer);
      autoUpdateTimer = null;
      unsubscribeDashiLocation();
      showAutoUpdateStopped();
    }

    function unsubscribeDashiLocation() {
      if (typeof unsubscribeLocation === "function") {
        unsubscribeLocation();
        unsubscribeLocation = null;
      }
    }

    async function prepareFirebase() {
      if (database && locationRef && firebaseModules) {
        return;
      }

      const firebaseAppModule = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
      const firebaseDatabaseModule = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js");
      const { initializeApp } = firebaseAppModule;
      const { getDatabase, ref } = firebaseDatabaseModule;

      firebaseModules = firebaseDatabaseModule;
      const app = initializeApp(firebaseConfig);
      database = getDatabase(app);
      locationRef = ref(database, `dashiLocations/${dashiId}`);
    }

    async function subscribeDashiLocation() {
      await prepareFirebase();
      unsubscribeDashiLocation();
      hideAutoUpdateStopped();

      unsubscribeLocation = firebaseModules.onValue(
        locationRef,
        (snapshot) => {
          handleSnapshotData(snapshot.val());
        },
        handleFirebaseError
      );

      startAutoUpdateTimer();
    }

    async function fetchLatestOnce() {
      await prepareFirebase();
      const snapshot = await firebaseModules.get(locationRef);
      handleSnapshotData(snapshot.val());
    }

    async function restartAutoUpdate() {
      elements.manualUpdateButton.disabled = true;
      elements.autoUpdatePanel.classList.add("is-visible");
      elements.autoUpdateMessage.textContent = "最新の位置を取得しています。";

      try {
        await fetchLatestOnce();
        await subscribeDashiLocation();
      } catch (error) {
        elements.manualUpdateButton.disabled = false;
        elements.autoUpdateMessage.textContent = "最新位置の取得に失敗しました。時間をおいてもう一度押してください。";
        showMessage(
          "error",
          `Firebaseの読み込みに失敗しました。<br>${escapeHtml(error.message || "設定や通信状態を確認してください。")}`
        );
      }
    }

    function handleSnapshotData(data) {
      if (!data) {
        showMessage(
          "error",
          `Firebaseに dashiLocations/${escapeHtml(dashiId)} のデータが見つかりません。`
        );
        elements.dashiName.textContent = dashiId;
        elements.dashiStatus.textContent = "データなし";
        elements.updatedAt.textContent = "未取得";
        return;
      }

      if (!isValidLocation(data)) {
        showMessage(
          "error",
          "緯度または経度の値を読み取れません。Firebaseの lat / lng を確認してください。"
        );
        return;
      }

      if (elements.message.classList.contains("error")) {
        hideMessage();
      }

      updateView(data);
    }

    function handleFirebaseError(error) {
      showMessage(
        "error",
        `Firebaseの読み込みに失敗しました。<br>${escapeHtml(error.message || "設定や通信状態を確認してください。")}`
      );
      elements.dashiName.textContent = dashiId;
      elements.dashiStatus.textContent = "読み込み失敗";
      elements.updatedAt.textContent = "未取得";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    async function startFirebaseListener() {
      if (isFirebaseConfigMissing(firebaseConfig)) {
        showMessage(
          "error",
          "Firebase設定が未入力です。<br>view.html内の firebaseConfig を、Firebaseコンソールの設定値に置き換えてください。"
        );
        elements.dashiName.textContent = dashiId;
        elements.dashiStatus.textContent = "Firebase設定待ち";
        elements.updatedAt.textContent = "未接続";
        return;
      }

      try {
        await subscribeDashiLocation();
      } catch (error) {
        showMessage(
          "error",
          `Firebaseの初期化に失敗しました。<br>${escapeHtml(error.message || "firebaseConfigを確認してください。")}`
        );
        elements.dashiStatus.textContent = "接続エラー";
        elements.updatedAt.textContent = "未接続";
      }
    }

    // ---- 周辺情報（pois.json） ----
    function poiIcon(cat) {
      const c = CATEGORIES[cat] || CATEGORIES.other;
      return L.divIcon({
        className: "",
        html: `<div class="poi-icon" style="background:${c.color}">${escapeHtml(c.short)}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    async function loadPois() {
      let data;
      try {
        const res = await fetch(POI_FILE, { cache: "no-cache" });
        if (!res.ok) {
          return;
        }
        data = await res.json();
      } catch (error) {
        // pois.json が無い・読めない場合は、山車だけを表示します。
        return;
      }

      if (!data || !Array.isArray(data.pois)) {
        return;
      }

      if (Array.isArray(data.center)) {
        poiCenter = data.center;
      }

      const groups = {};
      data.pois.forEach((poi) => {
        const lat = Number(poi.lat);
        const lng = Number(poi.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          return;
        }
        const cat = CATEGORIES[poi.cat] ? poi.cat : "other";
        groups[cat] = groups[cat] || L.layerGroup();
        L.marker([lat, lng], { icon: poiIcon(cat) })
          .bindPopup(
            `<strong>${escapeHtml(poi.name || CATEGORIES[cat].label)}</strong><br>${escapeHtml(CATEGORIES[cat].label)}` +
            (poi.note ? `<br><span class="poi-note">${escapeHtml(poi.note)}</span>` : "")
          )
          .addTo(groups[cat]);
      });

      Object.keys(CATEGORIES).forEach((cat) => {
        const group = groups[cat];
        if (!group) {
          return;
        }
        const c = CATEGORIES[cat];
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "poi-chip";
        chip.innerHTML = `<span class="poi-dot" style="background:${c.color}">${escapeHtml(c.short)}</span>${escapeHtml(c.label)}`;

        const setVisible = (visible) => {
          chip.setAttribute("aria-pressed", String(visible));
          if (visible) {
            group.addTo(map);
          } else {
            group.remove();
          }
        };
        setVisible(c.visible);
        chip.addEventListener("click", () => {
          setVisible(chip.getAttribute("aria-pressed") !== "true");
        });
        elements.poiChips.appendChild(chip);
      });

      if (Array.isArray(data.attribution) && data.attribution.length) {
        elements.poiAttribution.textContent = `地図上の施設情報の出典: ${data.attribution.join(" ／ ")}`;
      }

      refreshMapSize();
      maybeUpdateWeather();
    }

    // ---- 天気（Open-Meteo） ----
    function weatherPosition() {
      if (isValidLocation(latestData)) {
        return [Number(latestData.lat), Number(latestData.lng)];
      }
      return poiCenter || DEFAULT_CENTER;
    }

    function maybeUpdateWeather() {
      if (Date.now() - lastWeatherFetch < WEATHER_REFRESH_MS) {
        return;
      }
      lastWeatherFetch = Date.now();
      updateWeather();
    }

    async function updateWeather() {
      const [lat, lng] = weatherPosition();
      const url = "https://api.open-meteo.com/v1/forecast" +
        `?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}` +
        "&hourly=temperature_2m,precipitation_probability,precipitation" +
        "&timezone=Asia%2FTokyo&forecast_hours=6";

      try {
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const json = await res.json();
        const h = json.hourly;
        const hours = h.time.map((time, i) => ({
          hour: Number(time.slice(11, 13)),
          temp: h.temperature_2m[i],
          prob: h.precipitation_probability[i],
          rain: h.precipitation[i]
        }));

        const maxProb = Math.max(...hours.map((x) => x.prob ?? 0));
        const firstRain = hours.find((x) => (x.rain ?? 0) >= 0.5);
        let summary;
        if (firstRain) {
          summary = `☂ ${firstRain.hour}時ごろから雨の予報です`;
        } else if (maxProb >= 50) {
          summary = `☂ 雨の可能性があります（最大${maxProb}%）`;
        } else {
          summary = `しばらく雨の心配は少なそうです（最大${maxProb}%）`;
        }

        elements.weatherSummary.textContent = summary;
        elements.weatherSummary.classList.toggle("is-rainy", Boolean(firstRain) || maxProb >= 50);
        elements.weatherHours.innerHTML = hours.map((x) => (
          `<li>${x.hour}時<strong>${Math.round(x.temp)}℃</strong>${x.prob ?? "-"}%</li>`
        )).join("");
        elements.weatherCard.classList.add("is-visible");
      } catch (error) {
        // 天気が取れなくても山車表示には影響させません。次回また試します。
        lastWeatherFetch = Date.now() - WEATHER_REFRESH_MS + 5 * 60 * 1000;
      }
      refreshMapSize();
    }

    // ---- 追従 ----
    map.on("dragstart", () => {
      followDashi = false;
      elements.followButton.classList.add("is-visible");
    });

    elements.followButton.addEventListener("click", () => {
      followDashi = true;
      elements.followButton.classList.remove("is-visible");
      if (marker) {
        map.setView(marker.getLatLng(), Math.max(map.getZoom(), 16), { animate: true });
        marker.openPopup();
      }
    });

    setInterval(() => {
      updateStaleWarning(latestData);
    }, 30 * 1000);

    setInterval(maybeUpdateWeather, 5 * 60 * 1000);

    window.addEventListener("load", refreshMapSize);
    window.addEventListener("resize", refreshMapSize);
    window.addEventListener("orientationchange", refreshMapSize);
    elements.manualUpdateButton.addEventListener("click", restartAutoUpdate);

    refreshMapSize();
    startFirebaseListener();
    loadPois();
  </script>
</body>
</html>
