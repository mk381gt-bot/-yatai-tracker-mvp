[project]
name = "myhermes"
version = "0.1.0"
description = "自作の Hermes 風・自己成長型AIエージェント"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3.0"]

[project.scripts]
myhermes = "myhermes.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["myhermes"]
